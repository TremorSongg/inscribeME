server:
  port: 8080

spring:
  application:
    name: api-gateway
  # Deshabilitar completamente el servicio de recursos estáticos
  # El gateway solo debe rutear llamadas /api/**, no servir HTML
  web:
    resources:
      add-mappings: false
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        # ── Usuarios ──────────────────────────────────────────────────
        - id: servicio-usuarios
          uri: lb://SERVICIO-USUARIOS
          predicates:
            - Path=/api/usuarios/**

        # ── Cursos ────────────────────────────────────────────────────
        - id: servicio-cursos
          uri: lb://SERVICIO-CURSOS
          predicates:
            - Path=/api/cursos/**

        # ── Inscripciones ─────────────────────────────────────────────
        - id: servicio-inscripciones
          uri: lb://SERVICIO-INSCRIPCIONES
          predicates:
            - Path=/api/inscripciones/**

        # ── Carrito ───────────────────────────────────────────────────
        - id: servicio-carrito
          uri: lb://SERVICIO-CARRITO
          predicates:
            - Path=/api/carrito/**

        # ── Notificaciones ────────────────────────────────────────────
        - id: servicio-notificaciones
          uri: lb://SERVICIO-NOTIFICACIONES
          predicates:
            - Path=/api/notificaciones/**

        # ── Reportes ──────────────────────────────────────────────────
        - id: servicio-reportes
          uri: lb://SERVICIO-REPORTES
          predicates:
            - Path=/api/reportes/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 10

jwt:
  secret: InscribeMeSuperSecretKeyParaJWT2025ConSuficientesBits256!!

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
