server:
  port: 8081

spring:
  application:
    name: servicio-usuarios
  datasource:
    url: jdbc:mysql://localhost:3306/inscribeme_usuarios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  jackson:
    time-zone: America/Santiago

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 10
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: InscribeMeSuperSecretKeyParaJWT2025ConSuficientesBits256!!
  expiration: 86400000  # 24 horas en milisegundos

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
